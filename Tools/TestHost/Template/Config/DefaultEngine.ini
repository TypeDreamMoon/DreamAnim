; DreamAnim test host -- engine config.
;
; The host stands in for DevTest (I:\UnrealProject_Moon\DEV_58\DevTest). The renderer and platform
; values are DevTest's, copied verbatim because they feed the shader cache keys: a host that agrees
; with DevTest reads its already-warm derived data cache. The test runs themselves use -nullrhi.

[/Script/EngineSettings.GameMapsSettings]
; The lightest map the engine ships. The tests make their own worlds.
EditorStartupMap=/Engine/Maps/Entry.Entry
GameDefaultMap=/Engine/Maps/Entry.Entry

[/Script/Engine.RendererSettings]
; Copied verbatim from DevTest. These feed the shader map keys.
r.AllowStaticLighting=False
r.Shadow.Virtual.Enable=1
r.EarlyZPassOnlyMaterialMasking=False
r.GenerateMeshDistanceFields=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.SkinCache.CompileShaders=True
r.RayTracing=True
r.RayTracing.RayTracingProxies.ProjectEnabled=True
r.Substrate=True
r.Substrate.ProjectGBufferFormat=1
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.LocalExposure.HighlightContrastScale=0.8
r.DefaultFeature.LocalExposure.ShadowContrastScale=0.8
r.CustomDepth=3
r.RayTracing.Shadows=True
r.Mobile.AntiAliasing=4
r.AntiAliasingMethod=4

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
; Copied from DevTest: the RHI and shader formats are part of every shader cache key.
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
-D3D11TargetedShaderFormats=PCD3D_SM5
+D3D11TargetedShaderFormats=PCD3D_SM5

[/Script/Engine.MoonToonSettings]
; This engine's toon subsystem loads two ramp atlases from DevTest's MoonToon plugin, which the
; host does not carry. None skips the load instead of logging two failures a run.
GlobalDiffuseColorRampAtlas=None
GlobalSpecularColorRampAtlas=None
